<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قنوات عربية - البث المباشر</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo">
                <i class="fas fa-tv"></i>
                <span>قنوات عربية</span>
            </div>
            <nav>
                <ul>
                    <li><a href="#home">الرئيسية</a></li>
                    <li><a href="#channels">القنوات</a></li>
                    <li><a href="#schedule">جدول البرامج</a></li>
                    <li><a href="#favorites">المفضلة</a></li>
                    <li><a href="#contact">اتصل بنا</a></li>
                </ul>
            </nav>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="ابحث عن قناة..." id="searchInput">
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <h1>مرحباً بك في قنوات عربية</h1>
        <p>شاهد قنواتك المفضلة مباشرة بجودة عالية</p>
    </section>

    <!-- Categories & Channels -->
    <section class="categories" id="channels">
        <h2 class="section-title">
            <i class="fas fa-satellite-dish"></i>
            القنوات المتاحة
        </h2>

        <div class="category-tabs">
            <div class="tab active" data-category="all">الكل</div>
            <div class="tab" data-category="news">أخبار</div>
            <div class="tab" data-category="sports">رياضة</div>
            <div class="tab" data-category="entertainment">ترفيه</div>
            <div class="tab" data-category="kids">أطفال</div>
            <div class="tab" data-category="religious">دينية</div>
            <div class="tab" data-category="movies">أفلام</div>
        </div>

        <div class="channels-grid" id="channelsGrid">
            <!-- Channels will be loaded here -->
        </div>
    </section>

    <!-- Modal Player -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal">
                <i class="fas fa-times"></i>
            </button>
            <div class="video-container">
                <i class="fas fa-play-circle"></i>
            </div>
            <div class="player-info">
                <h2 id="playerChannelName">اسم القناة</h2>
                <p id="playerChannelDesc">وصف القناة</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer id="contact">
        <div class="footer-content">
            <h3>تواصل معنا</h3>
            <div class="social-links">
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-telegram"></i></a>
            </div>
            <p>© 2026 قنوات عربية - جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
